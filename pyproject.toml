[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datsmess"
version = "0.2.10"
description = "Plattformübergreifende Impedanz-, T/S- und LCR-Messsoftware für das Dayton Audio DATS V3 Mess-Interface"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "PySide6-Essentials>=6.6",
    "pyqtgraph>=0.13.4",
    "sounddevice>=0.4.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
datsmess = "datsmess.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
datsmess = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
